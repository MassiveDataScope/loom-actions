name: "Python Quality Report"
description: "Run ruff, pyright, pytest/coverage and optional bandit to produce one report"

inputs:
  src-dir:
    description: "Source directory"
    required: false
    default: "src"
  test-dir:
    description: "Test directory"
    required: false
    default: "tests"
  coverage-threshold:
    description: "Coverage threshold"
    required: false
    default: "80"
  fail-on-quality:
    description: "Fail condition for quality signals"
    required: false
    default: "any"
  fail-on-security:
    description: "Fail condition for security signals"
    required: false
    default: "high"
  include-security:
    description: "Whether to run bandit"
    required: false
    default: "true"
  test-results-dir:
    description: >
      Directory holding test results produced elsewhere: junit.xml, coverage.json and
      coverage.xml. When set, the action reports those results instead of running pytest
      itself, and fails when any of the three files is missing. Empty by default, in which
      case pytest runs here exactly as before.
    required: false
    default: ""
  working-directory:
    description: >
      Directory of the project to check, relative to the workspace. Every check and the
      report run there, so src-dir, test-dir and test-results-dir are relative to it,
      and uv.lock is looked for in it. The report paths this action returns are
      relative to the workspace. Defaults to the workspace itself.
    required: false
    default: "."

outputs:
  report-file:
    description: "Generated markdown report"
    value: ${{ steps.build.outputs.path_prefix }}${{ steps.build.outputs.report_file }}
  summary-file:
    description: "Generated JSON summary"
    value: ${{ steps.build.outputs.path_prefix }}${{ steps.build.outputs.summary_file }}
  blocking:
    description: "Whether gates are blocking"
    value: ${{ steps.build.outputs.blocking }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"

    - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

    - name: Run quality checks
      id: checks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs reach the scripts through the environment, never through an
      # expression in the script text, and each check reads them from its own
      # shell, so a value is never parsed as shell by either.
      env:
        TEST_RESULTS_DIR: ${{ inputs.test-results-dir }}
        SRC_DIR: ${{ inputs.src-dir }}
        TEST_DIR: ${{ inputs.test-dir }}
        INCLUDE_SECURITY: ${{ inputs.include-security }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        : > command_status.tsv

        # An existing lockfile is the resolution the caller committed, so it is
        # honoured instead of being re-resolved. A project without one is
        # resolved as before: --frozen would fail for want of a lockfile.
        FROZEN=""
        if [ -f uv.lock ]; then
          FROZEN="--frozen"
        fi

        run_check() {
          local name="$1"
          local cmd="$2"
          local artifacts="$3"

          set +e
          bash -lc "$cmd"
          local rc=$?
          set -e

          local status="pass"
          if [ "$rc" -ne 0 ]; then
            status="fail"
          fi

          printf '%s\t%s\t%s\t%s\t%s\n' \
            "$name" "$cmd" "$rc" "$status" "$artifacts" >> command_status.tsv
          return 0
        }

        run_check "ruff" "uv run $FROZEN --with-requirements \"\${ACTION_PATH}/requirements.txt\" ruff check \"\${SRC_DIR}\" --output-format json > ruff.json" "ruff.json"
        run_check "pyright" "uv run $FROZEN --with-requirements \"\${ACTION_PATH}/requirements.txt\" pyright \"\${SRC_DIR}\" --outputjson > pyright.json" "pyright.json"

        # Test results the caller already produced are reported as they are. The
        # report still blocks on a failed test or on coverage under the
        # threshold, because both are read from these files rather than from the
        # exit code of a pytest this action ran.
        if [ -n "${TEST_RESULTS_DIR:-}" ]; then
          for artifact in junit.xml coverage.json coverage.xml; do
            if [ ! -f "${TEST_RESULTS_DIR}/$artifact" ]; then
              echo "test-results-dir '${TEST_RESULTS_DIR}' does not contain $artifact"
              exit 1
            fi
            # A caller whose results are already in the workspace passes ".",
            # and cp refuses a file as its own destination.
            if [ ! "${TEST_RESULTS_DIR}/$artifact" -ef "./$artifact" ]; then
              cp "${TEST_RESULTS_DIR}/$artifact" "./$artifact"
            fi
          done
          printf '%s\t%s\t%s\t%s\t%s\n' \
            "pytest" "test results supplied by the caller" "0" "reused" \
            "junit.xml,coverage.json,coverage.xml" >> command_status.tsv
        else
          run_check "pytest" "PYTHONPATH=\"\${SRC_DIR}:\${PYTHONPATH:-}\" uv run $FROZEN --with-requirements \"\${ACTION_PATH}/requirements.txt\" pytest \"\${TEST_DIR}\" --cov=\"\${SRC_DIR}\" --cov-report=json:coverage.json --cov-report=xml:coverage.xml --junit-xml=junit.xml -o junit_family=legacy -v --tb=short" "junit.xml,coverage.json,coverage.xml"
        fi

        if [ "${INCLUDE_SECURITY}" = "true" ]; then
          run_check "bandit" "uv run $FROZEN --with-requirements \"\${ACTION_PATH}/requirements.txt\" bandit -r \"\${SRC_DIR}\" -f json -o bandit.json" "bandit.json"
        else
          echo '{"results":[]}' > bandit.json
          printf '%s\t%s\t%s\t%s\t%s\n' "bandit" "skipped" "0" "skipped" "bandit.json" >> command_status.tsv
        fi

    - name: Build markdown report
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        FAIL_ON_QUALITY: ${{ inputs.fail-on-quality }}
        FAIL_ON_SECURITY: ${{ inputs.fail-on-security }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # The report is written in the working directory, and a caller reads it
        # from the workspace root, so its paths carry the directory. Written
        # before the builder runs, because a blocking report exits non-zero.
        PATH_PREFIX=""
        if [ -n "${WORKING_DIRECTORY%/}" ] && [ "${WORKING_DIRECTORY%/}" != "." ]; then
          PATH_PREFIX="${WORKING_DIRECTORY%/}/"
        fi
        echo "path_prefix=${PATH_PREFIX}" >> "$GITHUB_OUTPUT"

        FROZEN=""
        if [ -f uv.lock ]; then
          FROZEN="--frozen"
        fi
        uv run $FROZEN --with-requirements "${ACTION_PATH}/requirements.txt" \
          python "${ACTION_PATH}/src/builder.py" \
            --ruff ruff.json \
            --pyright pyright.json \
            --junit junit.xml \
            --coverage coverage.json \
            --bandit bandit.json \
            --commands command_status.tsv \
            --template "${ACTION_PATH}/src/templates/report.md.j2" \
            --output quality_report.md \
            --summary quality_summary.json \
            --outputs "$GITHUB_OUTPUT" \
            --coverage-threshold "${COVERAGE_THRESHOLD}" \
            --fail-on-quality "${FAIL_ON_QUALITY}" \
            --fail-on-security "${FAIL_ON_SECURITY}"

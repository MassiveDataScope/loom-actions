name: "PR Comment Update"
description: "Create or update a PR/Issue comment identified by hidden HTML tags"

inputs:
  github-token:
    description: "GitHub token"
    required: true
  tags:
    description: "Comma-separated list of hidden tags"
    required: true
  body-file:
    description: "Markdown file path"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        BODY_FILE: ${{ inputs.body-file }}
      run: |
        set -euo pipefail
        if [ -z "${BODY_FILE}" ]; then
          echo "body-file input is empty"
          exit 1
        fi
        if [ ! -f "${BODY_FILE}" ]; then
          echo "body-file not found: ${BODY_FILE}"
          exit 1
        fi

    - name: Update or create comment
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        COMMENT_TAGS: ${{ inputs.tags }}
        BODY_FILE: ${{ inputs.body-file }}
      with:
        github-token: ${{ inputs.github-token }}
        # Inputs reach the script through the environment, never through template
        # expansion, so a caller passing PR data cannot inject code.
        script: |
          const fs = require('fs');
          const tags = (process.env.COMMENT_TAGS || '').split(',').map(t => t.trim()).filter(Boolean);
          if (tags.length === 0) {
            core.setFailed('No tags provided');
            return;
          }

          const body = fs.readFileSync(process.env.BODY_FILE, 'utf8');
          const full = `${tags.join('\n')}\n${body}`;

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });

          const existing = comments.find(c => c.body && tags.every(t => c.body.includes(t)));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: full });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body: full });
          }

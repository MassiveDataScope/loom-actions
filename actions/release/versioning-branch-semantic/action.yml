name: "Versioning Branch Semantic"
description: "Calculate next version from branch name and semantic rules"

inputs:
  branch:
    description: "Branch name"
    required: true
  prerelease:
    description: "Whether it is prerelease mode"
    required: false
    default: "false"
  config-file:
    description: "Path to TOML config"
    required: false
    default: "pyproject.toml"
  semantic-branch-config:
    description: >
      TOML file declaring [tool.semantic_branch]. Empty by default, in which case the
      rules are read from config-file as before. The version is always read from and
      written to config-file.
    required: false
    default: ""
  breaking:
    description: >
      "true" when a commit of the release declares a break (a "!" before the colon of
      its subject or a BREAKING CHANGE footer): the version is raised to a major and a
      release_ignore branch is released. "false" by default, which keeps the version
      the branch rules alone give.
    required: false
    default: "false"

outputs:
  version:
    description: "Calculated version"
    value: ${{ steps.calc.outputs.version }}
  deploy:
    description: "Whether deployment should happen"
    value: ${{ steps.calc.outputs.deploy }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"

    - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

    - name: Calculate version
      id: calc
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        PRERELEASE: ${{ inputs.prerelease }}
        CONFIG_FILE: ${{ inputs.config-file }}
        SEMANTIC_BRANCH_CONFIG: ${{ inputs.semantic-branch-config }}
        BREAKING: ${{ inputs.breaking }}
      run: |
        set -euo pipefail
        result=$(uv run --with-requirements "${{ github.action_path }}/requirements.txt" \
          python "${{ github.action_path }}/src/cli.py" \
          --branch "${BRANCH}" \
          --prerelease "${PRERELEASE}" \
          --config "${CONFIG_FILE}" \
          --semantic-branch-config "${SEMANTIC_BRANCH_CONFIG}" \
          --breaking "${BREAKING}")

        version=$(echo "$result" | awk -F= '/^version=/{print $2}')
        deploy=$(echo "$result" | awk -F= '/^deploy=/{print $2}')

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

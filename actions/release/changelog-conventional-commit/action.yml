name: "Changelog Conventional Commit"
description: "Generate changelog from conventional commits. Deprecated: new callers use plan-release/preview with changelog: true"

inputs:
  mode:
    description: "Mode: pr or release"
    required: true
  branch:
    description: "Branch name"
    required: true
  version:
    description: "Version label"
    required: false
  template:
    description: "Custom Jinja2 template path"
    required: false
  pr-number:
    description: "PR number"
    required: false
  output:
    description: "Output markdown file"
    required: false
    default: "changelog_preview.md"
  base-ref:
    description: "Base ref for PR mode"
    required: false
    default: "origin/main"

outputs:
  output_path:
    description: "Generated markdown path"
    value: ${{ steps.gen.outputs.output_path }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - uses: astral-sh/setup-uv@v3

    - name: Generate changelog
      id: gen
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BRANCH: ${{ inputs.branch }}
        OUTPUT: ${{ inputs.output }}
        BASE_REF: ${{ inputs.base-ref }}
        VERSION: ${{ inputs.version }}
        TEMPLATE: ${{ inputs.template }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail

        args=(
          --mode "${MODE}"
          --branch "${BRANCH}"
          --output "${OUTPUT}"
          --base-ref "${BASE_REF}"
        )

        if [ -n "${VERSION:-}" ]; then
          args+=(--version "${VERSION}")
        fi

        if [ -n "${TEMPLATE:-}" ]; then
          args+=(--template "${TEMPLATE}")
        fi

        if [ -n "${PR_NUMBER:-}" ]; then
          args+=(--pr-number "${PR_NUMBER}")
        fi

        uv run --with-requirements "${{ github.action_path }}/requirements.txt" \
          python "${{ github.action_path }}/src/cli.py" "${args[@]}"

        echo "output_path=${OUTPUT}" >> "$GITHUB_OUTPUT"

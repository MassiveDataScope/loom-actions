name: "Plan release"
description: "Decide the version a labelled merge releases, and write its notes"

inputs:
  merge-sha:
    description: "Commit the release is cut from"
    required: true
  repository-slug:
    description: "owner/repo the pull requests live in"
    required: true
  notes-output:
    description: "File the release notes are written to"
    required: false
    default: "CHANGELOG_RELEASE.md"
  github-token:
    description: "Token used to read the pull request of each shipped commit"
    required: true
  semantic-branch-config:
    description: >
      TOML file declaring [tool.semantic_branch], relative to the checkout. A monorepo
      passes the pyproject.toml of the package it releases.
    required: false
    default: "pyproject.toml"
  tag-prefix:
    description: >
      Prefix of the release tags read to plan the release and write its notes, before the
      version: v1.2.3 by default. A monorepo package that releases on its own passes its own,
      such as api-v, so another package's tags are never read. Letters, digits, ".", "_", "-"
      and "/" only.
    required: false
    default: "v"
  paths:
    description: >
      Paths the release ships, relative to the checkout and separated by newlines or commas,
      such as apps/control-plane and uv.lock: only the commits changing one of them count
      for the version, the declared breaks, the changelog and the notes, so a monorepo
      package never ships another package's pull requests. A range with no such commit,
      but the package's own changelog commits, releases nothing: the version output is
      empty, the step summary says why, no notes or changelog are written and the step
      succeeds. Paths are literal, never globs. No path may be absolute, hold "..", or
      start with "-" or ":". Empty, the default, ships every commit as before.
    required: false
    default: ""
  changelog-file:
    description: >
      CHANGELOG.md to add the release to, relative to the checkout, such as
      apps/control-plane/CHANGELOG.md; it follows Keep a Changelog 1.1.0 and is created when
      missing. Its new section, one entry per merged pull request title, becomes the notes.
      The file is left in the working tree for the caller to commit. Empty, the default,
      writes the notes as before and touches no file.
    required: false
    default: ""

outputs:
  version:
    description: "Version the release publishes; empty when a scoped release has nothing to ship"
    value: ${{ steps.plan.outputs.version }}
  part:
    description: "Version part the shipped branches asked for"
    value: ${{ steps.plan.outputs.part }}
  notes-file:
    description: "File holding the release notes"
    value: ${{ inputs.notes-output }}
  changelog-changed:
    description: "Whether changelog-file gained the release; false when it already listed it"
    value: ${{ steps.changelog.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Plan the release
      id: plan
      shell: bash
      env:
        MERGE_SHA: ${{ inputs.merge-sha }}
        REPOSITORY_SLUG: ${{ inputs.repository-slug }}
        NOTES_OUTPUT: ${{ inputs.notes-output }}
        GH_TOKEN: ${{ inputs.github-token }}
        SEMANTIC_BRANCH_CONFIG: ${{ inputs.semantic-branch-config }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        RELEASE_PATHS: ${{ inputs.paths }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 "${ACTION_PATH}/src/plan_release.py" \
          --merge-sha "${MERGE_SHA}" --slug "${REPOSITORY_SLUG}" \
          --semantic-branch-config "${SEMANTIC_BRANCH_CONFIG}" \
          --tag-prefix="${TAG_PREFIX}" | tee plan.txt
        PLAN=$(python3 "${ACTION_PATH}/src/plan_release.py" \
          --merge-sha "${MERGE_SHA}" --slug "${REPOSITORY_SLUG}" \
          --semantic-branch-config "${SEMANTIC_BRANCH_CONFIG}" \
          --tag-prefix="${TAG_PREFIX}" --format github)
        VERSION=$(jq -r .version <<< "${PLAN}")
        PART=$(jq -r .part <<< "${PLAN}")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "part=${PART}" >> "$GITHUB_OUTPUT"
        {
          echo "## Release ${TAG_PREFIX}${VERSION}"
          echo
          echo '```'
          cat plan.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # A scoped release whose paths no commit touched plans an empty version and
    # succeeds; the caller skips its tag and release on that empty output.
    - name: Report that nothing is released
      if: ${{ steps.plan.outputs.version == '' }}
      shell: bash
      env:
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail
        {
          echo
          echo "Nothing to release for ${TAG_PREFIX}: no commit since its last tag touches its paths, so no tag, GitHub Release, notes or changelog is written."
        } >> "$GITHUB_STEP_SUMMARY"

    # Runs in the checkout as the caller left it, the head of the base branch,
    # so the file gains the release on top of what that branch holds now.
    - name: Update the changelog
      id: changelog
      if: ${{ inputs.changelog-file != '' && steps.plan.outputs.version != '' }}
      shell: bash
      env:
        MERGE_SHA: ${{ inputs.merge-sha }}
        REPOSITORY_SLUG: ${{ inputs.repository-slug }}
        VERSION: ${{ steps.plan.outputs.version }}
        NOTES_OUTPUT: ${{ inputs.notes-output }}
        GH_TOKEN: ${{ inputs.github-token }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        RELEASE_PATHS: ${{ inputs.paths }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 "${ACTION_PATH}/src/changelog_file.py" \
          --merge-sha "${MERGE_SHA}" --slug "${REPOSITORY_SLUG}" --version "${VERSION}" \
          --tag-prefix="${TAG_PREFIX}" --changelog-file "${CHANGELOG_FILE}" \
          --notes-output "${NOTES_OUTPUT}" >> "$GITHUB_OUTPUT"

    - name: Write the release notes
      if: ${{ inputs.changelog-file == '' && steps.plan.outputs.version != '' }}
      shell: bash
      env:
        MERGE_SHA: ${{ inputs.merge-sha }}
        VERSION: ${{ steps.plan.outputs.version }}
        NOTES_OUTPUT: ${{ inputs.notes-output }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        RELEASE_PATHS: ${{ inputs.paths }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        git checkout --detach "${MERGE_SHA}"
        python3 "${ACTION_PATH}/src/build_release_notes.py" \
          --version "${VERSION}" --output "${NOTES_OUTPUT}" --tag-prefix="${TAG_PREFIX}"

# The docs deploy of plan §5 after review round 3: the reusable workflow only
# builds; this caller's own job deploys the artifact it uploaded.
name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: MassiveDataScope/loom-actions/.github/workflows/pages.yml@0000000000000000000000000000000000000000
    with:
      deploy: true
      python-version: "3.12"
      build-command: "cd apps/api && uv sync --locked && uv run --locked sphinx-build -W -b html ../../docs ../../docs/_build/html"
      output-dir: docs/_build/html
      fetch-depth: 0

  deploy:
    needs: build
    if: ${{ needs.build.outputs.pages-artifact == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

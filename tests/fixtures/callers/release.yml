# The release of plan §5 after review round 3: a package in apps/api released
# with its own rules, its image, and the upload to PyPI, which trusted
# publishing only accepts from the caller's own workflow file.
name: release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      merge_sha:
        type: string
        required: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: the-reacher-data/loom-actions/.github/workflows/release-on-label.yml@0000000000000000000000000000000000000000
    with:
      build-distribution: true
      package-name: acme-api
      package-dir: apps/api
      semantic-branch-config: apps/api/pyproject.toml
      check-distribution: true
      python-version: "3.12"
      merge-sha: ${{ inputs.merge_sha || '' }}

  image:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.version != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: the-reacher-data/loom-actions/.github/workflows/image-release.yml@0000000000000000000000000000000000000000
    with:
      version: ${{ needs.release.outputs.version }}
      expected-sha: ${{ github.event.pull_request.merge_commit_sha || inputs.merge_sha }}
      ghcr-image: ghcr.io/acme/app
      dockerhub-image: acme/app
      platforms: "linux/amd64,linux/arm64"
      dockerfile: Dockerfile
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    needs: release
    if: ${{ needs.release.outputs.distribution-built == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@0000000000000000000000000000000000000000
        with:
          skip-existing: true

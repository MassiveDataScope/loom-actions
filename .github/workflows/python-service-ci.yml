name: python-service-ci

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version the service runs on"
        required: true
        type: string
      python-versions:
        description: >-
          JSON array of the Python versions the tests run on, one leg each, like
          '["3.12", "3.14"]'. Empty by default: python-version alone. Duplicates run once and
          python-version is added when missing; lint, types, coverage threshold, report,
          Sonar and the image stay on python-version
        required: false
        type: string
        default: ""
      python-versions-experimental:
        description: >-
          JSON array of Python versions tested without blocking the gate, like '["3.15-dev"]';
          prereleases are allowed. Versions already in python-versions are ignored here
        required: false
        type: string
        default: ""
      uv-version:
        description: "uv version, pinned"
        required: false
        type: string
        default: "0.10.2"
      working-directory:
        description: >-
          Directory of the Python project, relative to the repository root and without a
          trailing slash; it holds pyproject.toml and uv.lock. uv, ruff, mypy, pytest and
          bandit run there, and src-dir and test-dir are relative to it. Sonar, the image
          and the branch check run from the root. Defaults to the root itself
        required: false
        type: string
        default: "."
      src-dir:
        description: "Source directory, relative to working-directory"
        required: false
        type: string
        default: "src"
      test-dir:
        description: "Test directory, relative to working-directory"
        required: false
        type: string
        default: "tests"
      typecheck:
        description: "Run mypy over src-dir"
        required: false
        type: boolean
        default: true
      coverage-threshold:
        description: "Minimum total coverage, in percent; 0 turns the gate off"
        required: false
        type: number
        default: 80
      fail-on-security:
        description: "Bandit severity that blocks: none, low, medium or high"
        required: false
        type: string
        default: "high"
      codecov:
        description: "Upload coverage and test results to Codecov"
        required: false
        type: boolean
        default: false
      codecov-flag:
        description: >-
          Codecov flag both uploads carry, for a repository that splits its coverage by
          component. Empty by default: the uploads carry no flag
        required: false
        type: string
        default: ""
      sonar:
        description: "Run a SonarQube or SonarCloud analysis"
        required: false
        type: boolean
        default: false
      sonar-blocking:
        description: >-
          Whether a Sonar analysis that fails, or is on without its token or project key,
          fails the gate. When false, it leaves a notice and the gate ignores it
        required: false
        type: boolean
        default: true
      sonar-host-url:
        description: "SonarQube server; SonarCloud by default"
        required: false
        type: string
        default: "https://sonarcloud.io"
      sonar-project-key:
        description: "Sonar project key, required when sonar is on"
        required: false
        type: string
        default: ""
      sonar-organization:
        description: "SonarCloud organization; empty for a self-hosted server"
        required: false
        type: string
        default: ""
      snyk:
        description: "Scan the locked runtime dependencies with Snyk"
        required: false
        type: boolean
        default: false
      snyk-severity-threshold:
        description: "Lowest Snyk severity that blocks: low, medium, high or critical"
        required: false
        type: string
        default: "high"
      image:
        description: "Build the container image"
        required: false
        type: boolean
        default: true
      image-context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to the repository root"
        required: false
        type: string
        default: "Dockerfile"
      image-smoke-command:
        description: "Shell command run inside the built image; empty skips the smoke test"
        required: false
        type: string
        default: ""
      image-scan:
        description: "Scan the built image for fixable vulnerabilities with Grype"
        required: false
        type: boolean
        default: true
      image-scan-severity:
        description: "Lowest fixable image vulnerability severity that blocks"
        required: false
        type: string
        default: "critical"
      semantic-branch-config:
        description: >-
          TOML file declaring [tool.semantic_branch] for the branch check, relative to the
          repository root. Empty by default, in which case the pyproject.toml in
          working-directory is read
        required: false
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token; public repositories can upload without it"
        required: false
      SONAR_TOKEN:
        description: "SonarQube token, required when sonar is on"
        required: false
      SNYK_TOKEN:
        description: "Snyk token, required when snyk is on"
        required: false

defaults:
  run:
    shell: bash

env:
  # The project's files as seen from the repository root. Empty with the default
  # working-directory, so every path is exactly the one used before.
  PROJECT_PREFIX: ${{ inputs.working-directory != '.' && inputs.working-directory != '' && format('{0}/', inputs.working-directory) || '' }}

jobs:
  # Normalises the version lists before any matrix reads them: fromJSON on a bad value
  # breaks the run without naming the value, and a duplicate would run twice.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      primary: ${{ steps.normalize.outputs.primary }}
      required: ${{ steps.normalize.outputs.required }}
      experimental: ${{ steps.normalize.outputs.experimental }}
    steps:
      - name: Normalise the Python versions
        id: normalize
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          PYTHON_VERSIONS_EXPERIMENTAL: ${{ inputs.python-versions-experimental }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          RELEASE = re.compile(r"3\.[0-9]+")
          PRERELEASE = re.compile(r"3\.[0-9]+(-dev)?")


          def fail(name, value, why):
              print(f"::error title=Invalid {name}::{value}: {why}")
              sys.exit(1)


          def versions(name, pattern):
              raw = os.environ[name.upper().replace("-", "_")].strip()
              if not raw:
                  return []
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError:
                  fail(name, raw, "not JSON; pass an array of strings like '[\"3.12\", \"3.14\"]'")
              if not isinstance(parsed, list):
                  fail(name, raw, "not a JSON array of strings")
              found = []
              for item in parsed:
                  if not isinstance(item, str) or not pattern.fullmatch(item):
                      shown = item if isinstance(item, str) else json.dumps(item)
                      fail(name, shown, "not a version like 3.12, quoted as a string")
                  if item not in found:
                      found.append(item)
              return found


          primary = os.environ["PYTHON_VERSION"].strip()
          if not RELEASE.fullmatch(primary):
              fail("python-version", primary, "not a version like 3.12")
          required = versions("python-versions", RELEASE)
          if primary not in required:
              required.append(primary)
          experimental = [
              v for v in versions("python-versions-experimental", PRERELEASE) if v not in required
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"primary={primary}\n")
              out.write(f"required={json.dumps(required)}\n")
              out.write(f"experimental={json.dumps(experimental)}\n")
          print(f"required: {' '.join(required)}")
          print(f"experimental: {' '.join(experimental) or 'none'}")
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SRC_DIR: ${{ inputs.src-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.PROJECT_PREFIX }}uv.lock

      - name: Install the locked environment
        run: |
          set -euo pipefail
          if [ ! -f uv.lock ]; then
            echo "::error title=uv.lock is missing::Commit uv.lock ('uv lock'): CI and the image install exactly that resolution."
            exit 1
          fi
          uv sync --locked

      - name: Ruff
        run: |
          set -euo pipefail
          uv run --locked ruff check --output-format=github .
          uv run --locked ruff format --check .

      - name: Mypy
        if: ${{ inputs.typecheck }}
        run: uv run --locked mypy "${SRC_DIR}"

  test:
    name: test (${{ matrix.python }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.required) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SRC_DIR: ${{ inputs.src-dir }}
      TEST_DIR: ${{ inputs.test-dir }}
      PYTHON_VERSION: ${{ matrix.python }}
      # The coverage threshold is a property of the primary leg alone; the others
      # measure coverage for their artifact but never fail on it.
      COVERAGE_THRESHOLD: ${{ matrix.python == needs.versions.outputs.primary && inputs.coverage-threshold || 0 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: ${{ env.PROJECT_PREFIX }}uv.lock
          cache-suffix: python-${{ matrix.python }}

      - name: Install the locked environment
        run: |
          set -euo pipefail
          if ! uv sync --locked --python "${PYTHON_VERSION}"; then
            echo "::error title=No locked environment for Python ${PYTHON_VERSION}::uv.lock or requires-python does not cover it; widen requires-python and run 'uv lock', or drop it from python-versions."
            exit 1
          fi

      - name: Run the test suite with coverage
        run: |
          set -euo pipefail
          uv run --locked --python "${PYTHON_VERSION}" --with "pytest-cov==7.1.0" pytest "${TEST_DIR}" \
            --cov="${SRC_DIR}" \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under="${COVERAGE_THRESHOLD}" \
            --junitxml=junit.xml -o junit_family=legacy

      - name: Store test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python }}
          path: |
            ${{ env.PROJECT_PREFIX }}junit.xml
            ${{ env.PROJECT_PREFIX }}coverage.xml
            ${{ env.PROJECT_PREFIX }}coverage.json
          if-no-files-found: warn
          retention-days: 7

      # report and sonar read the primary's results under the name they always had.
      - name: Store the primary test results
        if: ${{ !cancelled() && matrix.python == needs.versions.outputs.primary }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            ${{ env.PROJECT_PREFIX }}junit.xml
            ${{ env.PROJECT_PREFIX }}coverage.xml
            ${{ env.PROJECT_PREFIX }}coverage.json
          if-no-files-found: warn
          retention-days: 7

  # Visible, never blocking: the gate does not need this job.
  test-experimental:
    name: test-experimental (${{ matrix.python }})
    needs: versions
    if: ${{ needs.versions.outputs.experimental != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.experimental) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SRC_DIR: ${{ inputs.src-dir }}
      TEST_DIR: ${{ inputs.test-dir }}
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv does not read 3.N-dev, so setup-python installs the interpreter,
      # prereleases included, and uv is handed its path.
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Report an unavailable version
        if: ${{ failure() && steps.python.outcome == 'failure' }}
        run: echo "::warning title=Python ${PYTHON_VERSION} is not available::The runner cannot install it yet; this experimental leg does not block the gate."

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.PROJECT_PREFIX }}uv.lock
          cache-suffix: python-${{ matrix.python }}

      - name: Install the locked environment
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          if ! uv sync --locked --python "${PYTHON_PATH}"; then
            echo "::error title=No locked environment for Python ${PYTHON_VERSION}::uv.lock or requires-python does not cover it; widen requires-python and run 'uv lock', or drop it from python-versions-experimental."
            exit 1
          fi

      - name: Run the test suite with coverage
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          uv run --locked --python "${PYTHON_PATH}" --with "pytest-cov==7.1.0" pytest "${TEST_DIR}" \
            --cov="${SRC_DIR}" \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --junitxml=junit.xml -o junit_family=legacy

      - name: Store test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python }}
          path: |
            ${{ env.PROJECT_PREFIX }}junit.xml
            ${{ env.PROJECT_PREFIX }}coverage.xml
            ${{ env.PROJECT_PREFIX }}coverage.json
          if-no-files-found: warn
          retention-days: 7

  report:
    name: report
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      FAIL_ON_SECURITY: ${{ inputs.fail-on-security }}
      SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.PROJECT_PREFIX }}uv.lock

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results
          path: ${{ inputs.working-directory }}

      - name: Quality report
        id: quality
        continue-on-error: true
        uses: the-reacher-data/loom-actions/actions/python/quality-report@90b0ee6af678dfecf92c18a87e2a5f8081644309 # v1.4.0
        with:
          working-directory: ${{ inputs.working-directory }}
          src-dir: ${{ inputs.src-dir }}
          test-dir: ${{ inputs.test-dir }}
          coverage-threshold: ${{ inputs.coverage-threshold }}
          fail-on-quality: "none"
          fail-on-security: ${{ inputs.fail-on-security }}
          include-security: "true"
          test-results-dir: "."

      - name: Publish the report to the job summary
        if: ${{ always() && steps.quality.outputs.report-file != '' }}
        env:
          REPORT_FILE: ${{ steps.quality.outputs.report-file }}
        run: cat "${REPORT_FILE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the report on the pull request
        if: ${{ always() && github.event_name == 'pull_request' && env.SAME_REPOSITORY == 'true' && steps.quality.outputs.report-file != '' }}
        uses: the-reacher-data/loom-actions/actions/core/pr-comment-update@017878a375d4728129792fee009296635884b6d3 # v1.2.3
        with:
          github-token: ${{ github.token }}
          tags: "<!-- loom-quality-report -->"
          body-file: ${{ steps.quality.outputs.report-file }}

      - name: Check the Codecov token
        if: ${{ inputs.codecov }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "::warning title=Codecov has no token::codecov is on but CODECOV_TOKEN was not passed. A public repository uploads without it; a private one uploads nothing."
          fi

      - name: Upload coverage to Codecov
        if: ${{ inputs.codecov && !cancelled() && hashFiles(format('{0}coverage.xml', env.PROJECT_PREFIX)) != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./${{ env.PROJECT_PREFIX }}coverage.xml
          flags: ${{ inputs.codecov-flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ inputs.codecov && !cancelled() && hashFiles(format('{0}junit.xml', env.PROJECT_PREFIX)) != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./${{ env.PROJECT_PREFIX }}junit.xml
          report_type: test_results
          flags: ${{ inputs.codecov-flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Enforce the security gate
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.quality.outcome }}
          BLOCKING: ${{ steps.quality.outputs.blocking }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" != "success" ]; then
            echo "::error title=Quality report did not complete::Read the 'Quality report' step: no finding was cleared."
            exit 1
          fi
          if [ "${BLOCKING}" = "true" ]; then
            echo "::error title=Security gate::bandit reported issues at or above '${FAIL_ON_SECURITY}'."
            exit 1
          fi

  sonar:
    name: sonar
    needs: test
    if: >-
      ${{ inputs.sonar && !cancelled() && needs.test.result != 'skipped'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the SonarQube configuration
        id: config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_BLOCKING: ${{ inputs.sonar-blocking }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SONAR_TOKEN}" ] || missing="${missing} SONAR_TOKEN(secret)"
          [ -n "${SONAR_PROJECT_KEY}" ] || missing="${missing} sonar-project-key(input)"
          if [ -n "${missing}" ]; then
            if [ "${SONAR_BLOCKING}" != "true" ]; then
              echo "::notice title=SonarQube is on but not configured::missing:${missing}. sonar-blocking is false, so nothing was analysed and the gate ignores it."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=SonarQube is on but not configured::missing:${missing}. Provide them or turn sonar off."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download test results
        id: download
        if: ${{ steps.config.outputs.ready == 'true' }}
        continue-on-error: ${{ !inputs.sonar-blocking }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results
          path: ${{ inputs.working-directory }}

      - name: SonarQube scan
        id: scan
        if: ${{ steps.config.outputs.ready == 'true' }}
        continue-on-error: ${{ !inputs.sonar-blocking }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.sources=${{ env.PROJECT_PREFIX }}${{ inputs.src-dir }}
            -Dsonar.tests=${{ env.PROJECT_PREFIX }}${{ inputs.test-dir }}
            -Dsonar.python.version=${{ inputs.python-version }}
            -Dsonar.python.coverage.reportPaths=${{ env.PROJECT_PREFIX }}coverage.xml
            -Dsonar.python.xunit.reportPath=${{ env.PROJECT_PREFIX }}junit.xml
            ${{ inputs.sonar-organization != '' && format('-Dsonar.organization={0}', inputs.sonar-organization) || '' }}

      - name: Report an informative failure
        if: ${{ always() && !inputs.sonar-blocking && (steps.download.outcome == 'failure' || steps.scan.outcome == 'failure') }}
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          SCAN: ${{ steps.scan.outcome }}
        run: echo "::notice title=SonarQube did not complete::download ${DOWNLOAD}, scan ${SCAN}. sonar-blocking is false, so the gate ignores it."

  dependencies:
    name: dependencies
    if: >-
      ${{ inputs.snyk
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error title=Snyk is on but not configured::missing SNYK_TOKEN(secret). Provide it or turn snyk off."
            exit 1
          fi

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.PROJECT_PREFIX }}uv.lock

      - name: Install the locked runtime dependencies
        run: |
          set -euo pipefail
          uv export --locked --no-dev --no-emit-project --no-hashes -o "${RUNNER_TEMP}/requirements.txt"
          uv export --locked --no-dev --no-emit-project -o "${RUNNER_TEMP}/hashed-requirements.txt"
          uv venv --seed "${RUNNER_TEMP}/snyk-venv"
          uv pip install --python "${RUNNER_TEMP}/snyk-venv" --require-hashes \
            -r "${RUNNER_TEMP}/hashed-requirements.txt"

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SEVERITY: ${{ inputs.snyk-severity-threshold }}
        run: |
          set -uo pipefail
          snyk test \
            --file="${RUNNER_TEMP}/requirements.txt" \
            --package-manager=pip \
            --command="${RUNNER_TEMP}/snyk-venv/bin/python" \
            --severity-threshold="${SEVERITY}" \
            --skip-unresolved \
            --project-name="${GITHUB_REPOSITORY}"
          rc=$?
          case "${rc}" in
            0)
              echo "## Snyk: no dependency vulnerable at or above \`${SEVERITY}\`" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "::error title=Snyk found vulnerable dependencies::At or above '${SEVERITY}'; read the step log."
              exit 1
              ;;
            *)
              echo "::warning title=Snyk did not complete::Exit ${rc}. No dependency was cleared and none was reported vulnerable; this does not block. A 401 (SNYK-0005) means SNYK_TOKEN needs renewing."
              echo "## Snyk did not complete (exit ${rc}): nothing was scanned" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  image:
    name: image
    if: ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder runs the caller's Dockerfile; pinned by the digest
      # buildx-stable-1 resolved to on 2026-09-25, like image-release's.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 # buildx-stable-1, 2026-09-25

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: service
          tags: |
            type=sha,format=long

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.image-context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          pull: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Smoke test the image
        if: ${{ inputs.image-smoke-command != '' }}
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
          SMOKE_COMMAND: ${{ inputs.image-smoke-command }}
        run: docker run --rm --entrypoint /bin/sh "${IMAGE}" -c "${SMOKE_COMMAND}"

      - name: Report the image size
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          size=$(docker image inspect "${IMAGE}" --format '{{.Size}}')
          echo "## Image: $((size / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the image
        id: scan
        if: ${{ inputs.image-scan }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.meta.outputs.tags }}
          fail-build: true
          only-fixed: true
          severity-cutoff: ${{ inputs.image-scan-severity }}
          output-format: table
          output-file: ${{ runner.temp }}/grype.txt

      - name: Publish the scan to the job summary
        if: ${{ always() && inputs.image-scan && steps.scan.outcome != 'skipped' }}
        env:
          SCAN_FILE: ${{ runner.temp }}/grype.txt
        run: |
          set -euo pipefail
          if [ -s "${SCAN_FILE}" ]; then
            {
              echo "## Image vulnerabilities (fixable)"
              echo '```'
              cat "${SCAN_FILE}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  branch:
    name: branch
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a branch name the release can classify
        env:
          HEAD_REF: ${{ github.head_ref }}
          SEMANTIC_BRANCH_CONFIG: ${{ inputs.semantic-branch-config }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib

          head = os.environ["HEAD_REF"]
          config = os.environ["SEMANTIC_BRANCH_CONFIG"] or os.path.join(
              os.environ["WORKING_DIRECTORY"], "pyproject.toml"
          )
          if not os.path.isfile(config):
              print(
                  f"::error title=Branch rules not found::'{config}' does not exist. Pass "
                  f"semantic-branch-config, relative to the repository root, or add "
                  f"[tool.semantic_branch] to the pyproject.toml in working-directory."
              )
              sys.exit(1)
          with open(config, "rb") as handle:
              rules = tomllib.load(handle).get("tool", {}).get("semantic_branch", {})
          classes = ("major", "minor", "patch", "release_ignore")
          for name in classes:
              if any(re.fullmatch(pattern, head) for pattern in rules.get(name, ())):
                  print(f"'{head}' is a {name} branch")
                  sys.exit(0)
          patterns = ", ".join(p for name in classes for p in rules.get(name, ())) or "none declared"
          print(
              f"::error title=Unclassified branch::'{head}' matches no class in "
              f"[tool.semantic_branch] of '{config}', so a release would refuse it. Rename the branch "
              f"(accepted: {patterns})."
          )
          sys.exit(1)
          PY

  gate:
    name: gate
    # versions is needed so an invalid list, which only skips test, still fails
    # the gate; test-experimental is left out on purpose.
    needs: [versions, lint, test, report, sonar, dependencies, image, branch]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job that ran to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "${NEEDS}")
          if [ -n "${failed}" ]; then
            echo "::error title=CI failed::${failed}"
            exit 1
          fi

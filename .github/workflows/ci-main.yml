name: ci-main

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Run builder unit tests
        run: |
          uv run --with pytest --with jinja2 --with pyyaml --with tomli-w pytest -q tests/unit

      - name: Smoke quality action (strict)
        uses: ./actions/python/quality-report
        with:
          src-dir: examples/sample_project/src
          test-dir: examples/sample_project/tests
          coverage-threshold: "70"
          fail-on-quality: "any"
          fail-on-security: "high"
          include-security: "true"
